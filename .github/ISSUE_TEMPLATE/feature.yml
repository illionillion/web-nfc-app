name: 機能実装
description: 新機能の開発やエンハンスメント
title: "[Feature] "
labels: ["feature", "enhancement"]
body:
  - type: textarea
    id: overview
    attributes:
      label: 機能概要
      description: 実装したい機能の概要を記載してください。
      placeholder: 例：読取結果を書込フォームへ引き継ぐ「この内容で書く」機能
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 対象範囲
      description: 主にどの部分の機能実装ですか？
      options:
        - UI（ページ・コンポーネント・レイアウト）
        - Web NFC 読取（NDEFReader）
        - Web NFC 書込
        - Web NFC 消去
        - 履歴（localStorage）
        - 設定（Cookie / テーマ）
        - SEO・公開ページ
        - 共通（型定義・ユーティリティ）
        - その他
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外範囲
      description: 今回の機能実装では対象外とする範囲を明記してください。
      placeholder: |
        例：
        - iOS 対応は対象外
        - アカウント・クラウド同期は対象外
        - PWA は別 Issue
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: 背景・動機
      description: なぜこの機能が必要なのか、ユーザーにどんな価値を提供するかを記載してください。
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 受け入れ条件
      description: この機能が完成したとみなす条件を箇条書きで記載してください。
      placeholder: |
        - [ ] 読取結果から書込フォームへレコードを引き継げる
        - [ ] text / url / json が正しく復元される
        - [ ] 非対応ブラウザでは案内が表示される
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: 技術的な考慮事項
      description: 実装時に考慮すべき技術的な要素があれば記載してください。
      placeholder: 例：NDEFReader は Client Component のみ、Secure Context（HTTPS）必須など
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: その他・備考
      description: 補足情報や参考資料があれば記載してください。
    validations:
      required: false
