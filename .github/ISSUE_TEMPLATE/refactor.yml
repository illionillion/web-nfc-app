name: リファクタリング
description: コードの改善・リファクタリング
title: "[Refactor] "
labels: ["refactor", "improvement"]
body:
  - type: textarea
    id: target
    attributes:
      label: リファクタリング対象
      description: リファクタリングする対象を記載してください。
      placeholder: 例：NDEF 読取フック、履歴の localStorage 操作
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 対象カテゴリ
      description: 主にどの部分のリファクタリングですか？
      options:
        - UI（ページ・コンポーネント・レイアウト）
        - Web NFC 読取（NDEFReader）
        - Web NFC 書込
        - Web NFC 消去
        - 履歴（localStorage）
        - 設定（Cookie / テーマ）
        - 共通（型定義・ユーティリティ）
        - 設定（ビルド・ESLint・環境）
        - その他
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: リファクタリング対象外
      description: 今回のリファクタリングでは対象外とする範囲を明記してください。
      placeholder: |
        例：
        - 外部ライブラリは変更しない
        - 既存の機能動作は維持する
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: リファクタリングの理由
      description: なぜリファクタリングが必要なのかを記載してください。
      placeholder: |
        例：
        - コードの重複が多い
        - 可読性が低い
        - 型安全性の向上
        - パフォーマンスの改善
    validations:
      required: true

  - type: textarea
    id: current_issues
    attributes:
      label: 現在の問題点
      description: 現在のコードの具体的な問題点を記載してください。
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: 改善案
      description: どのように改善したいかの具体案を記載してください。
      placeholder: 例：hooks に切り出し、型定義を強化、共通ユーティリティ化など
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響範囲・リスク
      description: リファクタリングによる他への影響やリスクがあれば記載してください。
    validations:
      required: false

  - type: textarea
    id: testing_strategy
    attributes:
      label: テスト戦略
      description: リファクタリング時のテスト方針があれば記載してください。
      placeholder: 例：既存のテストケースで動作確認、新規テストケース追加
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: その他・備考
      description: 参考資料や補足情報があれば記載してください。
    validations:
      required: false
