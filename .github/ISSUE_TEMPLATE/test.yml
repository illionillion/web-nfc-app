name: テスト作成
description: テストケースの追加・改善
title: "[Test] "
labels: ["test"]
body:
  - type: textarea
    id: target
    attributes:
      label: テスト対象
      description: テストを作成する対象の機能・コンポーネントを記載してください。
      placeholder: 例：NDEF レコード変換ユーティリティ、履歴の保存・復元ロジック
    validations:
      required: true

  - type: dropdown
    id: test_type
    attributes:
      label: テストの種類
      description: 作成するテストの種類を選択してください。
      options:
        - Unit Test（単体テスト）
        - Integration Test（結合テスト）
        - Component Test（コンポーネントテスト）
        - E2E Test（エンドツーエンドテスト）
        - その他
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 対象範囲
      description: 主にどの部分のテストですか？
      options:
        - UI（ページ・コンポーネント・レイアウト）
        - Web NFC 読取（NDEFReader）
        - Web NFC 書込
        - Web NFC 消去
        - 履歴（localStorage）
        - 設定（Cookie / テーマ）
        - 共通（型定義・ユーティリティ）
        - その他
    validations:
      required: true

  - type: textarea
    id: test_exclusions
    attributes:
      label: テスト対象外
      description: 今回のテスト作成では対象外とする範囲を明記してください。
      placeholder: |
        例：
        - 実機 NFC ハードウェアの動作は対象外
        - ブラウザ固有の NDEFReader 実装はモックで対応
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: テスト作成の理由
      description: なぜこのテストが必要なのかを記載してください。
      placeholder: |
        例：
        - 現在テストがカバーされていない
        - バグが頻発している箇所
        - 重要なビジネスロジックの品質保証
    validations:
      required: true

  - type: textarea
    id: test_scenarios
    attributes:
      label: テストシナリオ
      description: テストしたい具体的なシナリオを箇条書きで記載してください。
      placeholder: |
        - [ ] 正常系：text / url / json レコードの変換成功
        - [ ] 異常系：不正な JSON のエラーハンドリング
        - [ ] 境界値：履歴 100 件超過時の古い件削除
    validations:
      required: true

  - type: textarea
    id: expected_coverage
    attributes:
      label: 期待するカバレッジ
      description: 目標とするテストカバレッジや重点的にテストしたい部分を記載してください。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: その他・備考
      description: 補足情報や参考資料があれば記載してください。
    validations:
      required: false
